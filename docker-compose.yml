services:
  mosdns:
    build:
      context: .
    image: mosdns-soc:v5.3.4
    container_name: mosdns
    environment:
      TZ: Asia/Shanghai
      ECS_PRESET: ${ECS_PRESET:-}
      DNS_LISTEN: ${DNS_LISTEN:-:53}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      CACHE_WAN_SIZE: ${CACHE_WAN_SIZE:-131072}
      CACHE_LAN_SIZE: ${CACHE_LAN_SIZE:-8192}
    restart: always
    network_mode: host
    volumes:
      - ./dat:/etc/mosdns/dat
      - ./cache:/etc/mosdns/cache
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
