# ============================================================
# config.yaml — mosdns v5 主配置
# ============================================================

log:
  level: ${LOG_LEVEL}

api:
  http: "0.0.0.0:8080"

include:
  - /etc/mosdns/dns.yaml
  - /run/mosdns/dat_exec.yaml

plugins:
  - type: udp_server
    args:
      entry: sequence
      listen: "${DNS_LISTEN}"

  - type: tcp_server
    args:
      entry: sequence
      listen: "${DNS_LISTEN}"

